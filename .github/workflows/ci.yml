# .github/workflows/ci.yml
# Phase 7 TEST-04: ci.yml runs astro check + vitest + playwright on PR + push to main.
# deploy.yml gates on this workflow via workflow_run.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: type check + chokepoint gates + build smoke (existing behavior + dist artifact upload)
  check:
    name: Type check + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run chokepoint gates (G1-G5, G7)
        run: bash scripts/gates.sh
      - name: Type check
        run: pnpm check
      - name: Build (smoke + G6 prep)
        run: pnpm exec astro build
      - name: Run post-build gate (G6)
        run: bash scripts/gates.sh
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Job 2: Vitest unit tests (parallel with playwright, both gated on check)
  unit:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync Astro types (vitest reads ~/content.config types)
        run: pnpm exec astro sync
      - name: Run Vitest (with coverage thresholds — CR-01)
        run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Job 3: Playwright E2E (parallel with unit, both gated on check)
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium (+ system deps)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps + verify browser (cache hit path)
        # WR-01: defend against partial caches. If a prior run was canceled
        # mid-download, actions/cache may have saved an empty/partial
        # ~/.cache/ms-playwright. `playwright install chromium` is
        # idempotent — a no-op if the binary is already present, a fresh
        # download otherwise. install-deps installs apt system libs only.
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright install-deps chromium
      - name: Run Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
