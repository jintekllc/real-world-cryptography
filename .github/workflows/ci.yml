# .github/workflows/ci.yml
# Runs on PRs to main. Same astro check gate as deploy, but does NOT publish.
# D-18:: PRs run the same gate but no deploy — separate from deploy.yml.
# D-20:: NO PR preview deploys in v1 — this workflow does not invoke
# the Astro Pages action and creates no preview job.

name: CI

on:
  pull_request:
    branches: [main]

# Concurrency keyed on PR ref so a new push to a PR cancels the previous run.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Read-only — this workflow does not write to Pages.
permissions:
  contents: read

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from package.json `packageManager` field
        # (pnpm@10.30.3); supplying `version:` here errors with
        # ERR_PNPM_BAD_PM_VERSION on action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chokepoint gates (G1-G5)
        # Phase 2 SCHM-07 + LIB-01..03 + Phase 3 PAGE-05 + D-61 enforcement:
        # G1 — localStorage chokepoint (D-33)
        # G2 — astro:content chokepoint (LIB-01, D-60 Phase 3 relaxation)
        # G2b — pages may not read questions/assessments (D-29, D-60)
        # G3 — no Astro.glob() (D-41)
        # G4 — z from astro/zod, not astro:content (D-39)
        # G5 — no <script> / no client:* in src/pages/, src/components/, src/layouts/
        # G6 — SKIPS pre-build (no dist/ yet); re-run after build below.
        # Exit non-zero on any violation; CI fails before astro check.
        run: bash scripts/gates.sh

      - name: Type check
        # Use `pnpm check` (astro sync && astro check) so generated types are
        # current before type-checking. `astro check` alone leaves stale
        # types on schema edits, masking real drift.
        run: pnpm check

      - name: Build (smoke)
        # Build to catch issues astro check misses (e.g., asset paths,
        # broken imports inside .astro files only loaded at build time).
        # No artifact upload — this run is purely a gate (D-20:: no preview deploy).
        run: pnpm exec astro build

      - name: Run post-build gate (G6)
        # Phase 3 PAGE-05 + D-61 enforcement:
        # G6 — zero .js/.mjs in dist/ AND every Phase 3 route emitted.
        # Re-runs gates.sh now that dist/ exists; G6 SKIPped during the
        # earlier "Run chokepoint gates" step because dist/ wasn't built yet.
        run: bash scripts/gates.sh
