# .github/workflows/deploy.yml
# Builds and deploys the Astro static site to GitHub Pages after a successful CI
# run on main (gated via workflow_run + the build job's `if:` clause).
# Plan 07-04 chained this to ci.yml; manual dispatch bypasses the gate.
# D-01:: hosted at github.com/jintekllc/real-world-cryptography
# D-19:: Pages source must be set to "GitHub Actions" in repo Settings > Pages
# (one-time manual step before first deploy — Pitfall P1.3, locked in Plan 05 checkpoint).

name: Deploy to GitHub Pages

on:
  # D-PLAN-07-04: deploy chains off ci.yml (workflow named "CI"). Pages only
  # publishes if CI completed successfully on main. workflow_dispatch remains
  # for manual emergency deploys (bypasses the workflow_run gate via the
  # build job's `if:` clause below).
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# D-17: a newer push supersedes a running deploy.
concurrency:
  group: pages
  cancel-in-progress: true

# Required by GitHub Pages OIDC publish path.
# https://docs.astro.build/en/guides/deploy/github/
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # D-PLAN-07-04: gate the build on CI success (or explicit manual dispatch).
    # workflow_dispatch carries no `workflow_run` context, so the OR keeps the
    # manual bypass functional; a red CI run produces `conclusion: failure` /
    # `cancelled` / `timed_out` and this expression evaluates false, skipping
    # the deploy entirely.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is read from package.json `packageManager` field
        # (pnpm@10.30.3); supplying `version:` here errors with
        # ERR_PNPM_BAD_PM_VERSION on action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'   # D-23: Astro 6 minimum
          cache: 'pnpm'           # D-07

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chokepoint gates (G1-G5)
        # Phase 2 SCHM-07 + LIB-01..03 + Phase 3 PAGE-05 + D-61 enforcement:
        # Fail the deploy on any chokepoint violation (G1 localStorage, G2/G2b
        # astro:content, G3 Astro.glob, G4 z from astro:content, G5 zero JS in
        # src/pages/components/layouts). G6 is the post-build assertion below.
        # Runs before astro check so a clean type-check on a leaky bundle never
        # masks a discipline violation.
        run: bash scripts/gates.sh

      - name: Type check
        # D-16:: astro check is the deploy gate in Phase 1.
        # Failing types must fail the deploy. No test framework runs here.
        # `pnpm check` chains `astro sync` so generated types are fresh
        # before checking — `astro check` alone leaves stale types on
        # schema edits and silently masks real drift.
        run: pnpm check

      - name: Build site locally for post-build gate (G6 needs dist/)
        # Phase 3 PAGE-05 + D-61 enforcement:
        # withastro/action@v6 runs astro build internally, but G6 needs to
        # inspect dist/ BEFORE the artifact is uploaded. Build locally first
        # so the post-build gate has dist/ to assert against.
        run: pnpm exec astro build

      - name: Run post-build gate (G6)
        # Re-runs gates.sh now that dist/ exists; G6 SKIPped during the
        # earlier "Run chokepoint gates" step because dist/ wasn't built yet.
        # If G6 fails, the deploy is aborted before the artifact upload.
        run: bash scripts/gates.sh

      - name: Install Playwright Chromium for smoke
        # Plan 07-06: the production smoke step (next) runs Playwright against
        # `astro preview` serving the locally-built dist/. The browser binary
        # is not cached on the runner, so install it (with system deps) on
        # every run. Chromium-only mirrors playwright.config.ts (v1 lock).
        run: pnpm exec playwright install --with-deps chromium

      - name: Production smoke test
        # Plan 07-06: tests/e2e/production-smoke.spec.ts walks every emitted
        # route (61 in v1) and asserts response.ok() + no console errors + no
        # critical axe violations. This is the LAST gate before publish — if
        # any route fails, abort the deploy. Runs against the dist/ produced
        # by the previous "Build site locally" step (Playwright's webServer
        # config spawns `astro preview` against it).
        run: pnpm test:smoke

      - name: Build, package, and upload Pages artifact
        # withastro/action runs `astro build` and uploads the dist/ artifact
        # via actions/upload-pages-artifact internally.
        # The packaged artifact preserves dist/.nojekyll (D-04:) verbatim.
        # Per D-19: reconciliation 2026-04-30: pinned to v6 (current major).
        uses: withastro/action@v6

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Per D-19: reconciliation: pinned to v5 (current major as of 2026-04-30).
        uses: actions/deploy-pages@v5
